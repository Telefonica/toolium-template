name: build

on:
  pull_request:

jobs:
  python-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-versions.outputs.versions }}
      oldest: ${{ steps.set-versions.outputs.oldest }}
    steps:
    - name: Set supported python versions
      id: set-versions
      run: |
        versions='["3.11", "3.12", "3.13", "3.14"]'
        echo "versions=$versions" >> "$GITHUB_OUTPUT"
        echo "oldest=$(echo "$versions" | jq -r '.[0]')" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    needs: python-versions
    steps:
    - uses: actions/checkout@v6
    - name: Set up python ${{ needs.python-versions.outputs.oldest }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ needs.python-versions.outputs.oldest }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt
    - name: Lint and format check with ruff
      run: |
        ruff check .
        ruff format --check .

  behave-tests:
    runs-on: ubuntu-latest
    needs: python-versions
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
      fail-fast: false
    steps:
    - uses: actions/checkout@v6
    - name: Set up python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      env:
        TOOLIUM_DRIVER_HEADLESS: Driver_headless=true
      run: |
        behave features/ --junit --junit-directory output/reports --tags=~@skip
      continue-on-error: true
    - name: Upload output folder
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: behave-tests-output-${{ matrix.python-version }}
        path: output
    - name: Publish test results
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: behave tests results (${{ matrix.python-version }})
        path: output/reports/*.xml
        reporter: java-junit
        fail-on-error: true
